services:
  postgres:
    image: postgres:16
    container_name: taskalign_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskalign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskalign_password}
      POSTGRES_DB: ${POSTGRES_DB:-taskalign}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taskalign_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskalign} -d ${POSTGRES_DB:-taskalign}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: taskalign_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskalign}:${POSTGRES_PASSWORD:-taskalign_password}@postgres:5432/${POSTGRES_DB:-taskalign}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: taskalign_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  taskalign_pgdata:
